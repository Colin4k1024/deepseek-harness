# CI/CD Pipeline for dsh-rust
#
# Triggers on push/PR to master when rust/ files change.
# Jobs: check, test, clippy, fmt, coverage, e2e, benchmark

name: Rust CI/CD

on:
  push:
    branches: [master]
    paths: ['rust/**']
  pull_request:
    paths: ['rust/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Lint & Format
  # ──────────────────────────────────────────────
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: rust

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace -- -D warnings
        working-directory: rust

  # ──────────────────────────────────────────────
  # Build & Test
  # ──────────────────────────────────────────────
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check --workspace
        working-directory: rust

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
        working-directory: rust

  test-macos:
    name: cargo test (macOS)
    runs-on: macos-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
        working-directory: rust

  test-windows:
    name: cargo test (Windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
        working-directory: rust

  # ──────────────────────────────────────────────
  # E2E Tests
  # ──────────────────────────────────────────────
  e2e:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test -p dsh-e2e-tests
        working-directory: rust

  # ──────────────────────────────────────────────
  # Coverage
  # ──────────────────────────────────────────────
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Generate coverage report
        working-directory: rust
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info \
            --ignore-filename-regex='.*/tests/.*' \
            --ignore-filename-regex='.*/test-support/.*'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: rust/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────
  # Benchmarks
  # ──────────────────────────────────────────────
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run benchmarks
        working-directory: rust
        run: cargo bench --workspace -- --output-format bencher | tee benchmark-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: rust/benchmark-results.txt

  # ──────────────────────────────────────────────
  # Release (on tag push)
  # ──────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, e2e, clippy, fmt]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        working-directory: rust
        run: cargo build --release --workspace
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/target/release/dsh
            rust/target/release/dsh-web
          generate_release_notes: true
