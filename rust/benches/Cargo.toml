[package]
name = "dsh-benchmarks"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]
dsh-core-context = { path = "../crates/core-context" }
dsh-core-session = { path = "../crates/core-session" }
dsh-core-tools = { path = "../crates/core-tools" }
dsh-core-agent-loop = { path = "../crates/core-agent-loop" }
dsh-core-memory = { path = "../crates/core-memory" }
dsh-core-workflow = { path = "../crates/core-workflow" }
dsh-llm-adapter = { path = "../crates/llm-adapter" }
dsh-seam-auth = { path = "../crates/seam-auth" }
dsh-seam-observability = { path = "../crates/seam-observability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
path = "core_benchmarks.rs"
harness = false

[[bench]]
name = "memory_benchmarks"
path = "memory_benchmarks.rs"
harness = false

[[bench]]
name = "auth_benchmarks"
path = "auth_benchmarks.rs"
harness = false
