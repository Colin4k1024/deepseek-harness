[workspace]
resolver = "2"
members = [
    "crates/core-context",
    "crates/core-session",
    "crates/core-tools",
    "crates/core-agent-loop",
    "crates/llm-adapter",
    "crates/llm-deepseek",
    "crates/seam-fs",
    "crates/seam-sandbox",
    "crates/seam-subprocess",
    "crates/bundle-base",
    "crates/bundle-web-app",
    "crates/bundle-headless",
    "crates/test-support",
    "crates/mcp-client",
    "crates/llm-openai",
    "crates/llm-anthropic",
    "crates/seam-persistence",
    "crates/core-evolution",
    "crates/core-orchestrator",
    "crates/seam-observability",
    "crates/seam-auth",
    "crates/core-workflow",
    "crates/core-memory",
    "crates/seam-session-distributed",
    "crates/core-plugin",
    "crates/seam-multitenant",
    "crates/core-i18n",
    "crates/seam-a11y",
    "crates/seam-mobile",
    "crates/seam-cache",
    "crates/seam-resilience",
    "crates/seam-canary",
    "crates/seam-migration",
    "crates/seam-backup",
    "crates/seam-monitor",
    "crates/seam-resources",
    "crates/seam-autoscale",
    "crates/seam-tracing",
    "crates/seam-logging",
    "crates/seam-gateway",
    "crates/seam-traffic",
    "crates/seam-scheduler",
    "crates/seam-queue",
    "crates/core-eventstore",
    "crates/core-cqrs",
    "crates/seam-messagebus",
    "crates/core-saga",
    "crates/seam-grpc",
    "crates/core-federated",
    "crates/seam-edge",
    "crates/core-incremental",
    "crates/seam-multiregion",
    "crates/seam-compliance",
    "crates/core-knowledge",
    "crates/core-vectordb",
    "crates/core-rag",
    "crates/core-crossmodal",
    "crates/seam-media",
    "crates/seam-tools",
    "tests",
    "benches",
    "apps/dsh-headless",
    "apps/dsh-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-harness"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Concurrency
dashmap = "6"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP
reqwest = { version = "0.12", features = ["stream", "json"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rust-mcp-sdk = { version = "1.0", features = ["macros"] }

# Database
rusqlite = { version = "0.35", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Testing
insta = { version = "1", features = ["json"] }

# Internal crates
dsh-core-context = { path = "crates/core-context" }
dsh-core-session = { path = "crates/core-session" }
dsh-core-tools = { path = "crates/core-tools" }
dsh-core-agent-loop = { path = "crates/core-agent-loop" }
dsh-llm-adapter = { path = "crates/llm-adapter" }
dsh-llm-deepseek = { path = "crates/llm-deepseek" }
dsh-seam-fs = { path = "crates/seam-fs" }
dsh-seam-sandbox = { path = "crates/seam-sandbox" }
dsh-seam-subprocess = { path = "crates/seam-subprocess" }
dsh-bundle-base = { path = "crates/bundle-base" }
dsh-bundle-web-app = { path = "crates/bundle-web-app" }
dsh-bundle-headless = { path = "crates/bundle-headless" }
dsh-test-support = { path = "crates/test-support" }
