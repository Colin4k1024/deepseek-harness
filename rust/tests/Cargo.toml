[package]
name = "dsh-e2e-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[test]]
name = "e2e"
path = "src/e2e.rs"

[[test]]
name = "load_stress"
path = "src/load_stress.rs"

[dependencies]
dsh-core-context = { path = "../crates/core-context" }
dsh-core-session = { path = "../crates/core-session" }
dsh-core-tools = { path = "../crates/core-tools" }
dsh-core-agent-loop = { path = "../crates/core-agent-loop" }
dsh-core-orchestrator = { path = "../crates/core-orchestrator" }
dsh-core-workflow = { path = "../crates/core-workflow" }
dsh-core-memory = { path = "../crates/core-memory" }
dsh-core-evolution = { path = "../crates/core-evolution" }
dsh-llm-adapter = { path = "../crates/llm-adapter" }
dsh-seam-persistence = { path = "../crates/seam-persistence" }
dsh-seam-auth = { path = "../crates/seam-auth" }
dsh-seam-observability = { path = "../crates/seam-observability" }
dsh-seam-sandbox = { path = "../crates/seam-sandbox" }
dsh-seam-tools = { path = "../crates/seam-tools" }
dsh-bundle-web-app = { path = "../crates/bundle-web-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
insta = { version = "1", features = ["json"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
tempfile = "3"
